<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&display=swap" />
  <link rel="preload" href="theme/fonts/graduate-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="theme/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="theme/css/pickleballers-theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/night.css" />
  <link rel="stylesheet" href="css/arena.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0A0A0C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pickleball" />
</head>
<body class="matchmaking-page">
  <div class="league-banner" id="league-banner"></div>
  <header class="top-bar"><h1>Matchmaking</h1><button id="settings-btn" class="settings-link" title="Change data source">⚙</button></header>
  <main>
    <div id="loading" class="loading" role="status">Loading players…</div>

    <div id="mm-content" style="display:none">
      <section class="mm-section">
        <div class="mm-section-head">
          <h2>Who's here</h2>
          <span class="mm-count" id="mm-count">0 here</span>
        </div>
        <div class="picker-heading">
          <span class="picker-hint">Tap everyone who's playing tonight.</span>
          <span class="mm-head-actions"><button type="button" class="picker-clear" id="mm-all">All</button><button type="button" class="picker-clear" id="mm-none">Clear</button></span>
        </div>
        <div class="player-grid" id="mm-roster"></div>
      </section>

      <section class="mm-section mm-settings">
        <div class="live-option">
          <span class="live-option-label">Courts</span>
          <div class="mm-stepper">
            <button type="button" id="mm-courts-down" aria-label="One fewer court">−</button>
            <b id="mm-courts">1</b>
            <button type="button" id="mm-courts-up" aria-label="One more court">+</button>
          </div>
        </div>
        <div class="live-option">
          <span class="live-option-label">Format</span>
          <div class="toggle-group" id="mm-format">
            <button type="button" data-format="Doubles" class="active">Doubles</button>
            <button type="button" data-format="Singles">Singles</button>
          </div>
        </div>
        <div class="live-option">
          <span class="live-option-label">How to match</span>
          <div class="toggle-group" id="mm-mode"></div>
          <p class="field-help" id="mm-mode-help"></p>
        </div>
        <div class="live-option">
          <span class="live-option-label">Game to</span>
          <div class="toggle-group" id="mm-target">
            <button type="button" data-target="11" class="active">11</button>
            <button type="button" data-target="15">15</button>
            <button type="button" data-target="21">21</button>
          </div>
        </div>
      </section>

      <button type="button" class="primary btn" id="mm-make">Make round 1</button>
      <div id="mm-status" class="status" style="display:none"></div>

      <section id="mm-round" class="mm-round" style="display:none">
        <div class="mm-section-head">
          <h2 id="mm-round-title">Round 1</h2>
          <button type="button" class="picker-clear" id="mm-reshuffle">Reshuffle</button>
        </div>
        <p class="mm-swap-hint" id="mm-swap-hint">Tap a name, then another, to swap them.</p>
        <div id="mm-games"></div>
        <div class="mm-sitout" id="mm-sitout"></div>
      </section>

      <section id="mm-earlier" class="mm-earlier" style="display:none">
        <h2>Earlier rounds</h2>
        <ol id="mm-earlier-list"></ol>
      </section>

      <button type="button" class="mm-new-night" id="mm-new-night">Start a new night</button>
    </div>
  </main>

  <nav class="tab-bar">
    <a href="index.html">

      Leaderboard

    <a href="live-game.html" class="active">

      Live

    <a href="brackets.html">

      Brackets

    <a href="history.html">

    <a href="players.html">

      Players

  </nav>

  <script src="js/config.js"></script>

</body>
</html>
